name: Recover Supabase Migration History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-migration-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Fetch and commit missing migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify recovery secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required to recover migration history."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref#http://}"
          project_ref="${project_ref%%.*}"
          if [ -z "$project_ref" ] || [ "$project_ref" = "$SUPABASE_URL" ]; then
            echo "::error title=Invalid Supabase URL::VITE_SUPABASE_URL must be a Supabase project URL."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - name: Fetch missing migrations from Supabase
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # `migration fetch` replaces the migration directory. Preserve the
          # pending migration authored in this repository before fetching the
          # historical SQL stored in Supabase.
          pending_migration="supabase/migrations/20260828000000_portfolio_backend.sql"
          cp "$pending_migration" "$RUNNER_TEMP/$(basename "$pending_migration")"

          yes | supabase migration fetch --linked

          cp "$RUNNER_TEMP/$(basename "$pending_migration")" "$pending_migration"

      - name: Commit recovered migration history
        shell: bash
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "Migration history is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restore Supabase migration history"
          git push origin HEAD:main
